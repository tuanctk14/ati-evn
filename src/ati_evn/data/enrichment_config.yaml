# Multi-source enrichment configuration
# Weights sum to 1.0; thresholds are provider-specific units.
# AggregateService (slice 13B) reads this without knowing provider names.

enrichment:
  # Weights for aggregate risk_score computation (slice 13B)
  weights:
    virustotal: 0.35
    abuseipdb: 0.30
    otx: 0.15
    pulsedive: 0.10
    leakix: 0.10

  # Cache TTL per provider (hours)
  ttl_hours:
    virustotal: 24
    abuseipdb: 24
    otx: 24
    pulsedive: 12
    leakix: 12

  # Provider execution tiers (slice 13B uses this)
  foreground_providers: [abuseipdb, virustotal]
  background_providers: [otx, pulsedive, leakix]

  # Provider-specific verdict thresholds (adapter uses these)
  providers:
    virustotal:
      # Verdict = f(malicious engine count)
      malicious_engines: 5
      suspicious_engines: 1

    abuseipdb:
      # Verdict = f(abuseConfidenceScore 0-100)
      malicious_score: 50
      suspicious_score: 25

    otx:
      # Verdict = f(pulse_count)
      malicious_pulses: 3
      suspicious_pulses: 1

    pulsedive:
      # Verdict = f(risk level string)
      # Risk levels: none, low, medium, high, critical
      malicious_level: medium
      suspicious_level: low

    leakix:
      # Verdict = f(event count + event types)
      malicious_event_types:
        - "credential-leak"
        - "database-open"
        - "admin-panel-open"
        - "backup-exposed"
      # Any exposure = suspicious (banner/config visible)
      suspicious_on_any_event: true

  # Scoring policy per provider (used by ScoringEngine.score_from_signal).
  # Formulas: passthrough, weighted_count, bucket, level_map, composite,
  # lookup_table. This is the ONLY place normalized_score math lives --
  # adapters extract signals, ScoringEngine turns signals into scores.
  scoring:
    abuseipdb:
      formula: passthrough
      field: abuse_confidence

    virustotal:
      formula: lookup_table
      field: malicious_engines
      interpolate: false          # discrete count semantic
      lookup:
        0: 0
        1: 20
        2: 35
        3: 50
        4: 60
        5: 75
        10: 90
        20: 100

    otx:
      formula: bucket
      field: pulse_count
      buckets:
        - {max: 0, score: 0}
        - {max: 1, score: 25}
        - {max: 2, score: 50}
        - {max: 5, score: 65}
        - {max: 10, score: 75}
        - {max: 999, score: 90}

    pulsedive:
      formula: level_map
      field: risk_level
      map:
        none: 0
        unknown: 0
        low: 25
        medium: 50
        high: 75
        critical: 100

    leakix:
      formula: composite
      base_field: services_count
      base_per_unit: 3
      base_cap: 50
      bonus_field: malicious_event_types_count
      bonus_per_unit: 30
      cap: 90
