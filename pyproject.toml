[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ati-evn"
version = "0.1.0"
description = "ATI-EVN — Agentic Threat Intelligence for EVN and subsidiaries"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Hoang" }]

dependencies = [
    # Core
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",

    # DB
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # HTTP
    "httpx>=0.27",

    # Scheduler
    "apscheduler>=3.10",

    # Telegram
    "aiogram>=3.4",

    # Parsing
    "feedparser>=6.0",       # RSS
    "beautifulsoup4>=4.12",  # HTML scraping fallback

    # Logging
    "structlog>=24.1",

    # Matching
    "packaging>=24.0",

    # ATT&CK enrichment (slice 4.5)
    # torch >=2.6 required: transformers/ST refuse to torch.load legacy .bin
    # weights (basel/ATTACK-BERT ships .bin only) on older torch due to
    # CVE-2025-32434. 2.6 unblocks the primary ATTACK-BERT model.
    "torch>=2.6",
    "sentence-transformers>=2.6",

    # Sigma rules (slice 4.7)
    "pyyaml>=6.0",
    "pysigma>=0.11",
    "gitpython>=3.1",

    # Alert dispatch (slice 5A)
    "tenacity>=8.2",

    # Article ingestion (slice 7A)
    "pypdf>=4.0",
    "trafilatura>=1.6",

    # Export weekly_report PDF (slice 5B.2) — optional; export.py degrades
    # to markdown output if reportlab isn't installed.
    "reportlab>=4.0",

    # CyRadar-style global report (slice 8A) — HTML canonical + PDF via
    # wkhtmltopdf. Requires the wkhtmltopdf binary on PATH (or
    # WKHTMLTOPDF_PATH set) — see src/ati_evn/reports/renderer.py.
    "jinja2>=3.1.0",
    "pdfkit>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
ati-evn = "ati_evn.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
